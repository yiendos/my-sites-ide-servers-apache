services:
    apache:
        container_name: "apache"
        image: ${NAMESPACE}_apache:latest
        build:
            context: .
            dockerfile: Dockerfile
        ports:
            - "8443:8443"
        expose:
            - "8443"
        environment:
            FPM_HOST: "fpm:9000"
        volumes:
            # Read-only config ships with the package; each site's vhosts are picked up from
            # Repos/*/_build/config/*-apache.conf (see IncludeOptional in conf/httpd.conf)
            - ./conf/httpd.conf:/usr/local/apache2/conf/httpd.conf
            # The self-signed certificate is shared with the IDE's nginx, so it stays in core
            - ${IDE_ROOT}/_dev/environment/servers/ssl/selfsigned.crt:/usr/local/apache2/conf/server.crt
            - ${IDE_ROOT}/_dev/environment/servers/ssl/selfsigned.key:/usr/local/apache2/conf/server.key
            - ${IDE_ROOT}/Repos:/opt/repos
        networks:
            - my-sites-ide

    # started by `ide:spark` alongside APP (autostart: true in composer.json)
    # PHP requests are proxied to the IDE's fpm service, so that needs to be running too
